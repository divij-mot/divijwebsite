<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Divij Motwani</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The builder embeds a cross-origin preview iframe. Cross-origin isolation
      // (needed for FFmpeg on the rest of the site) would block that frame.
      if (location.pathname.startsWith('/builder')) {
        navigator.serviceWorker?.getRegistrations?.().then((regs) => {
          if (!regs.length) return;
          Promise.all(regs.map((r) => r.unregister())).then(() => {
            if (window.crossOriginIsolated) location.reload();
          });
        });
      } else {
        const s = document.createElement('script');
        s.src = '/coi-serviceworker.js';
        document.body.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
